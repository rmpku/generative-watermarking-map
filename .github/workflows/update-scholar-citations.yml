name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check SerpApi secret
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "::error::Add SERPAPI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Update citation snapshots
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        working-directory: docs
        run: node scripts/update-scholar-citations.mjs data/papers.json

      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- docs/data/papers.json; then
            echo "No citation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/papers.json
          git commit -m "chore: update Google Scholar citations"
          git push
